services:
  - serviceName: wger-server
    language: python
    framework: pytest
    testDirectory: tests/skyramp
    api:
      schemaPath: http://localhost:8091/api/v2/schema?format=json
      authType: token
      authHeader: Authorization
      authScheme: Token
      baseUrl: http://localhost:8091
    runtimeDetails:
      serverStartCommand: docker compose -p eval-25-wger up -d web
      runtime: docker
      dockerNetwork: eval-25-wger_default
