services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wger
      POSTGRES_USER: wger
      POSTGRES_PASSWORD: wger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wger"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      # REPO_PATH is exported by start-services.sh before docker compose runs.
      # Dockerfile.eval is copied from the fixture dir to REPO_PATH by start-services.sh.
      context: ${REPO_PATH}
      dockerfile: Dockerfile.eval
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8091:8000"
    environment:
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_DATABASE: wger
      DJANGO_DB_USER: wger
      DJANGO_DB_PASSWORD: wger
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: 5432
      DJANGO_DEBUG: "True"
      SECRET_KEY: eval-insecure-secret-key-not-for-prod-wger
      SIGNING_KEY: eval-insecure-signing-key-not-for-prod-wger
      AXES_ENABLED: "False"
      SITE_URL: http://localhost:8091
      USE_CELERY: "False"
      SYNC_EXERCISES_ON_STARTUP: "False"
      DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP: "False"
      DOWNLOAD_EXERCISE_VIDEOS_ON_STARTUP: "False"
      LOAD_ONLINE_FIXTURES_ON_STARTUP: "False"
      DJANGO_PERFORM_MIGRATIONS: "True"
      WGER_USE_GUNICORN: "True"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v2/version/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    volumes:
      - wger-media:/home/wger/media
      - wger-static:/home/wger/static

volumes:
  wger-media:
  wger-static:
